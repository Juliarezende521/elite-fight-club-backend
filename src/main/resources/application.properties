spring.application.name=Implementacao
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
payment.provider=${PAYMENT_PROVIDER:mock}
asaas.base-url=${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
asaas.api-key=${ASAAS_API_KEY:}
asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}
app.public-url=${APP_PUBLIC_URL:}
checkin.minutes-before=${CHECKIN_MINUTES_BEFORE:15}
checkin.minutes-after=${CHECKIN_MINUTES_AFTER:15}
checkin.frontend-base-url=${CHECKIN_FRONTEND_BASE_URL:http://localhost:3000}
notificacoes.legado.enabled=${NOTIFICACOES_LEGADO_ENABLED:false}
financeiro.notificacoes.enabled=${FINANCEIRO_NOTIFICACOES_ENABLED:false}
financeiro.notificacoes.cron=${FINANCEIRO_NOTIFICACOES_CRON:0 0 9 * * *}
financeiro.notificacoes.atraso-dias=${FINANCEIRO_NOTIFICACOES_ATRASO_DIAS:2}
financeiro.notificacoes.time-zone=${FINANCEIRO_NOTIFICACOES_TIME_ZONE:America/Sao_Paulo}



