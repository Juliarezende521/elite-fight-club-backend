spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/elite}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
checkin.minutes-before=${CHECKIN_MINUTES_BEFORE:15}
checkin.minutes-after=${CHECKIN_MINUTES_AFTER:15}
checkin.frontend-base-url=${CHECKIN_FRONTEND_BASE_URL:http://localhost:3000}
